id: venue-booking
displayName: Community hall and venue booking
description: Search and create venue bookings. Cancellation is not available in this release. Use tenantId "pg" (state level) for lookup_master.
allowedRolesHint:
  - CITIZEN
  - CHB_CEMP
  - CHB_APPROVER
  - CHB_VERIFIER
masters:
  - module: CHB
    name: CommunityHalls
  - module: CHB
    name: Venues
  - module: CHB
    name: Purpose
  - module: CHB
    name: SpecialCategory
operations:
  search:
    type: READ
    description: Search venue bookings.
    readOnly: true
    destructive: false
    requiresConfirmation: false
    httpMethod: POST
    gatewayPath: /chb-services/booking/v1/_search
    supportsStatus: true
    statusArgument: bookingNo
    inputSchema:
      type: object
      additionalProperties: false
      required: [tenantId]
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 128
        bookingNo:
          type: string
          maxLength: 128
        status:
          type: string
          maxLength: 64
        venueCode:
          type: string
          maxLength: 128
        mobileNumber:
          type: string
          maxLength: 15
    query:
      tenantId:
        "$payload": tenantId
      bookingNo:
        "$payload": bookingNo
      status:
        "$payload": status
      venueCode:
        "$payload": venueCode
      mobileNumber:
        "$payload": mobileNumber
      limit:
        "$page": size
      offset:
        "$page": offset
    response:
      listPath: venueBookingApplication
      keep:
        - bookingNo
        - bookingId
        - bookingStatus
        - tenantId
        - venueCode
    examples:
      - tenantId: pg.citya
        bookingNo: CHB-555
  create:
    type: WRITE
    description: Create a venue booking. Slot and purpose codes must come from lookup_master.
    readOnly: false
    destructive: false
    requiresConfirmation: true
    httpMethod: POST
    gatewayPath: /chb-services/booking/v1/_create
    filestoreModule: CHB
    documentsTarget: venueBookingApplication.documents
    inputSchema:
      type: object
      additionalProperties: false
      required: [tenantId, venueCode, venueType, purpose, purposeDescription, specialCategory, bookingSlotDetails, applicantDetail, address, documents]
      properties:
        tenantId:
          type: string
          minLength: 1
          maxLength: 128
        venueCode:
          type: string
        venueType:
          type: string
        purpose:
          type: object
          additionalProperties: false
          required: [purpose]
          properties:
            purpose:
              type: string
        specialCategory:
          type: object
          additionalProperties: false
          required: [category]
          properties:
            category:
              type: string
        purposeDescription:
          type: string
        bookingSlotDetails:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [bookingDate, bookingFromTime, bookingToTime, unitCode, capacity, status]
            properties:
              bookingDate:
                type: string
              bookingFromTime:
                type: string
              bookingToTime:
                type: string
              unitCode:
                type: string
              capacity:
                type: string
              status:
                type: string 
        applicantDetail:
          type: object
          additionalProperties: false
          required: [applicantName, applicantMobileNo, applicantEmailId, accountNumber, ifscCode, bankName, bankBranchName, accountHolderName]
          properties:
            applicantName:
              type: string
              maxLength: 100
            applicantMobileNo:
              type: string
              minLength: 10
              maxLength: 10
            applicantEmailId:
              type: string
            applicantAlternateMobileNo:
              type: string
            accountNumber:
              type: string
              minLength: 8
              maxLength: 18
            ifscCode:
              type: string
            bankName:
              type: string
            bankBranchName:
              type: string
            accountHolderName:
              type: string
            refundType:
              type: string
            refundStatus:
              type: string
        documents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [documentType, fileName, contentType, contentBase64]
            properties:
              documentType:
                type: string
              fileName:
                type: string
              contentType:
                type: string
              contentBase64:
                type: string
        address:
          type: object
          additionalProperties: false
          required: [city, cityCode, locality, localityCode, pincode]
          properties:
            city:
              type: string
            cityCode:
              type: string
            locality:
              type: string
            localityCode:
              type: string
            pincode:
              type: string
            doorNo:
              type: string
            houseNo:
              type: string
            streetName:
              type: string
            addressLine1:
              type: string
            landmark:
              type: string

    requestBody:
      venueBookingApplication:
        tenantId:
          "$payload": tenantId
        venueCode:
          "$payload": venueCode
        venueType:
          "$payload": venueType
        purpose:
          "$payload": purpose
        specialCategory:
          "$payload": specialCategory
        bookingSlotDetails:
          "$payload": bookingSlotDetails
        applicantDetail:
          "$payload": applicantDetail
        purposeDescription:
          "$payload": purposeDescription
        address:
          "$payload": address
        bookingStatus:
          "$constant": "BOOKING_CREATED"
    response:
      listPath: venueBookingApplication
      keep:
        - bookingNo
        - bookingId
        - bookingStatus
        - tenantId
    examples:
      - tenantId: pg.citya
        venueCode: HALL-1
        purpose:
          purpose: Marriage
        specialCategory:
          category: General
        bookingSlotDetails:
          - bookingDate: "2026-10-20"
            bookingFromTime: "10:00"
            bookingToTime: "14:00"
            unitCode: "HALL-1"
            capacity: "500"
            status: "BOOKING_CREATED"    
