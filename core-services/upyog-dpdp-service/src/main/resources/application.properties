server.servlet.context-path=/upyog-dpdp-service
server.port=8096
app.timezone=UTC

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.flyway.url=jdbc:postgresql://localhost:5432/postgres
spring.flyway.user=postgres
spring.flyway.password=postgres
spring.flyway.baseline-on-migrate=true
spring.flyway.outOfOrder=true
spring.flyway.locations=classpath:/db/migration/main
spring.flyway.enabled=true

kafka.config.bootstrap_server_config=localhost:9092
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=upyog-dpdp-service
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false

persister.save.consent.topic=save-dpdp-consent
persister.update.consent.topic=update-dpdp-consent
persister.save.privacy.event.topic=save-dpdp-privacy-event
persister.save.principal.request.topic=save-dpdp-principal-request
persister.update.principal.request.topic=update-dpdp-principal-request
persister.save.scan.topic=save-dpdp-scan
persister.update.scan.topic=update-dpdp-scan
persister.save.finding.topic=save-dpdp-finding
persister.save.incident.topic=save-dpdp-incident
persister.update.incident.topic=update-dpdp-incident
persister.save.risk.topic=save-dpdp-risk
persister.save.remediation.topic=save-dpdp-remediation

dpdp.event.consent.topic=dpdp.consent.v1
dpdp.event.rights.topic=dpdp.rights.v1
dpdp.event.retention.topic=dpdp.retention.v1
dpdp.event.scan.topic=dpdp.scan.v1
dpdp.event.finding.topic=dpdp.compliance-finding.v1
dpdp.event.incident.topic=dpdp.incident.v1
dpdp.event.audit.topic=dpdp.audit.v1

dpdp.kafka.persister-enabled=false
dpdp.default.offset=0
dpdp.default.limit=50
dpdp.max.limit=200

egov.mdms.host=http://localhost:8094
egov.mdms.search.endpoint=/egov-mdms-service/v1/_search
egov.idgen.host=http://localhost:8088
egov.idgen.endpoint=/egov-idgen/id/_generate
egov.user.host=http://localhost:8081
egov.user.search.endpoint=/user/_search
egov.enc.host=http://localhost:1234
egov.workflow.host=http://localhost:8280
egov.notification.sms.topic=egov.core.notification.sms

scheduler.retention.enabled=true
scheduler.retention.cron=0 30 2 * * *
retention.default.action=SOFT_DELETE

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
