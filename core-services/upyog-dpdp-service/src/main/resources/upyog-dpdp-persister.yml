  mappings:
    - version: 1.0
      name: save-dpdp-consent
      description: Insert consent
      fromTopic: save-dpdp-consent
      isTransaction: true
      queryMaps:
        - query: INSERT INTO ug_dpdp_consent(id, consent_number, tenant_id, data_principal_uuid, fiduciary, application_code, data_category, purpose_code, processing_basis, status, version, source, language, granted_time, withdrawal_time, expiry_time, notice_ref, createdby, lastmodifiedby, createdtime, lastmodifiedtime) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);
          basePath: Consent
          jsonMaps:
            - jsonPath: $.Consent.id
            - jsonPath: $.Consent.consentNumber
            - jsonPath: $.Consent.tenantId
            - jsonPath: $.Consent.dataPrincipalUuid
            - jsonPath: $.Consent.fiduciary
            - jsonPath: $.Consent.applicationCode
            - jsonPath: $.Consent.dataCategory
            - jsonPath: $.Consent.purposeCode
            - jsonPath: $.Consent.processingBasis
            - jsonPath: $.Consent.status
            - jsonPath: $.Consent.version
            - jsonPath: $.Consent.source
            - jsonPath: $.Consent.language
            - jsonPath: $.Consent.grantedTime
            - jsonPath: $.Consent.withdrawalTime
            - jsonPath: $.Consent.expiryTime
            - jsonPath: $.Consent.noticeRef
            - jsonPath: $.Consent.createdBy
            - jsonPath: $.Consent.lastModifiedBy
            - jsonPath: $.Consent.createdTime
            - jsonPath: $.Consent.lastModifiedTime
    - version: 1.0
      name: update-dpdp-consent
      description: Update consent status
      fromTopic: update-dpdp-consent
      isTransaction: true
      queryMaps:
        - query: UPDATE ug_dpdp_consent SET status = ?, withdrawal_time = ?, lastmodifiedby = ?, lastmodifiedtime = ? WHERE id = ? AND tenant_id = ?;
          basePath: Consent
          jsonMaps:
            - jsonPath: $.Consent.status
            - jsonPath: $.Consent.withdrawalTime
            - jsonPath: $.Consent.lastModifiedBy
            - jsonPath: $.Consent.lastModifiedTime
            - jsonPath: $.Consent.id
            - jsonPath: $.Consent.tenantId
