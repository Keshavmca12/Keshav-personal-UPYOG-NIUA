apiVersion: apps/v1
kind: Deployment
metadata:
  name: upyog-dpdp-service
  labels:
    app: upyog-dpdp-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: upyog-dpdp-service
  template:
    metadata:
      labels:
        app: upyog-dpdp-service
    spec:
      containers:
        - name: upyog-dpdp-service
          image: upyogio/upyog-dpdp-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: upyog-dpdp-service
          livenessProbe:
            httpGet:
              path: /upyog-dpdp-service/actuator/health
              port: 8080
            initialDelaySeconds: 60
          readinessProbe:
            httpGet:
              path: /upyog-dpdp-service/actuator/health
              port: 8080
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: upyog-dpdp-service
  labels:
    app: upyog-dpdp-service
    zuul/route-path: /upyog-dpdp-service
spec:
  selector:
    app: upyog-dpdp-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: upyog-dpdp-service
data:
  SERVER_SERVLET_CONTEXT_PATH: /upyog-dpdp-service
  SERVER_PORT: "8080"
  DPDP_KAFKA_PERSISTER_ENABLED: "false"
  RETENTION_DEFAULT_ACTION: SOFT_DELETE
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: upyog-dpdp-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: upyog-dpdp-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
